<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e12">
  <title>DynamicTV</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='4' fill='%235aa9ff'/%3E%3Crect x='6' y='10' width='20' height='12' rx='2' fill='%230b0e12'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff4d4d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="7" width="26" height="18" rx="4" fill="currentColor"/>
        <rect x="6" y="10" width="20" height="12" rx="2" fill="#0b0e12"/>
        <circle cx="16" cy="16" r="3" fill="#ff4d4d"/>
      </svg>
      <span>DynamicTV</span>
    </div>
    <div id="now-playing" class="now-playing">
      <span class="live-dot" hidden></span>
      <span class="np-number"></span>
      <span class="np-name">Not tuned</span>
    </div>
    <div id="status" class="pill">connecting…</div>
    <div class="user-wrap">
      <button id="user-btn" class="user-btn" aria-haspopup="menu" aria-expanded="false">
        <span id="avatar" class="avatar">?</span>
        <span id="user-name" class="user-name"></span>
      </button>
      <div id="user-menu" class="menu" role="menu" hidden>
        <button id="menu-password" class="menu-item" role="menuitem">Change password</button>
        <button id="menu-users" class="menu-item" role="menuitem" hidden>Manage users</button>
        <div class="menu-sep"></div>
        <button id="menu-logout" class="menu-item" role="menuitem">Log out</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="player">
      <div class="video-wrap">
        <video id="video" controls playsinline preload="auto"></video>

        <div id="overlay" class="overlay">
          <div class="overlay-inner">
            <div id="overlay-spinner" class="spinner" hidden></div>
            <div id="overlay-icon" class="overlay-icon">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <rect x="4" y="10" width="40" height="28" rx="5" fill="none" stroke="currentColor" stroke-width="2.5"/>
                <path d="M16 4l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 19v10l9-5z" fill="currentColor"/>
              </svg>
            </div>
            <div id="overlay-title" class="overlay-title">Pick a channel</div>
            <div id="overlay-text" class="overlay-text">Everyone on the network watches the same stream, in sync.</div>
            <button id="tap" class="tap" hidden>▶&nbsp; Tap to play</button>
          </div>
        </div>

        <div id="toast" class="toast" hidden></div>
      </div>

      <div class="toolbar">
        <div class="ch-nav">
          <button id="ch-down" class="btn icon" title="Previous channel (↓ / PageDown)" aria-label="Previous channel">
            <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="ch-up" class="btn icon" title="Next channel (↑ / PageUp)" aria-label="Next channel">
            <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div id="sync" class="sync-chip" title="">
          <span class="sync-dot"></span>
          <span id="sync-text" class="sync-text">idle</span>
          <span id="sync-detail" class="sync-detail"></span>
        </div>

        <div class="toolbar-spacer"></div>

        <button id="fullscreen" class="btn icon" title="Fullscreen (F)" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="stop" class="btn danger" title="Stop the shared stream on every device">Stop</button>
      </div>
    </section>

    <aside class="sidebar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="channels" role="tab" aria-selected="true">Channels</button>
        <button class="tab" data-tab="chat" role="tab" aria-selected="false">Chat <span id="chat-badge" class="badge" hidden></span></button>
      </div>

      <div id="panel-channels" class="panel active">
        <div class="sidebar-head">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="search" type="search" placeholder="Search channels" autocomplete="off" spellcheck="false">
          </label>
          <button id="refresh" class="btn text" title="Reload lineup from the HDHomeRun">Refresh</button>
        </div>
        <p class="hint">One shared stream. Changing the channel here changes it for everyone.</p>
        <div id="channels" class="channels"><div class="hint">Loading lineup…</div></div>
      </div>

      <div id="panel-chat" class="panel">
        <div id="presence" class="presence"></div>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" maxlength="500" placeholder="Say something…" autocomplete="off">
          <button class="btn primary" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z" fill="currentColor"/></svg>
          </button>
        </form>
      </div>
    </aside>
  </main>

  <dialog id="password-dialog" class="dialog">
    <form method="dialog" class="form" id="password-form">
      <h2>Change password</h2>
      <label class="field"><span>Current password</span><input name="current" type="password" autocomplete="current-password" required></label>
      <label class="field"><span>New password</span><input name="next" type="password" autocomplete="new-password" minlength="6" required></label>
      <label class="field"><span>Confirm new password</span><input name="confirm" type="password" autocomplete="new-password" required></label>
      <div class="form-error" hidden></div>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="users-dialog" class="dialog wide">
    <div class="form">
      <h2>Users</h2>
      <div id="users-list" class="users-list"></div>
      <form id="add-user-form" class="add-user" autocomplete="off">
        <h3>Add a user</h3>
        <div class="row">
          <input name="username" placeholder="Username" autocapitalize="off" spellcheck="false" required>
          <input name="password" type="password" placeholder="Password (6+ chars)" autocomplete="new-password" minlength="6" required>
        </div>
        <label class="check"><input name="admin" type="checkbox"> Admin (can manage users)</label>
        <div class="form-error" hidden></div>
        <div class="dialog-actions">
          <button type="button" class="btn" data-close>Close</button>
          <button type="submit" class="btn primary">Add user</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
